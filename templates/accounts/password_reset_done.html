<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Email Sent — Church of Christ CMS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"DM Sans",sans-serif;padding:20px}
    .auth-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
    h1{font-family:"Playfair Display",serif;font-size:1.4rem;color:#0f172a;margin-bottom:12px}
    .btn-gold{background:#d4a843;border:none;color:#fff;font-weight:600;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:16px}
    .btn-gold:hover{background:#c89a35;color:#fff}
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="font-size:3rem;margin-bottom:16px;">&#9993;</div>
    <h1>Check Your Email</h1>
    <p class="text-muted">We've sent password reset instructions to your email. Follow the link in the email to set a new password.</p>
    <p class="text-muted small">Didn't receive it? Check your spam folder, or make sure you entered the correct email address.</p>
    <a href="{% url 'login' %}" class="btn-gold">Back to Login</a>
  </div>
</body>
</html>
