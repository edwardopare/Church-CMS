{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><h5>Reset your password</h5></div>
        <div class="card-body">
          <p class="text-muted">Enter your email address and we'll send a link to reset your password.</p>
          <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}
            {{ form.email }}
            <button type="submit" class="btn btn-gold mt-3">Send reset email</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
