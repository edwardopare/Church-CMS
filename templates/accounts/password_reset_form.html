<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password — Church of Christ CMS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"DM Sans",sans-serif;padding:20px}
    .auth-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .brand{text-align:center;margin-bottom:28px}
    .brand h1{font-family:"Playfair Display",serif;font-size:1.4rem;color:#0f172a;margin:8px 0 4px}
    .form-control:focus{border-color:#d4a843;box-shadow:0 0 0 3px rgba(212,168,67,.15)}
    .btn-gold{background:#d4a843;border:none;color:#fff;font-weight:600;padding:12px;border-radius:8px;width:100%;font-size:1rem}
    .btn-gold:hover{background:#c89a35;color:#fff}
    label{font-size:.85rem;font-weight:500;color:#374151}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div style="font-size:2rem;color:#d4a843;">&#10013;</div>
      <h1>Forgot Password?</h1>
      <p class="text-muted small mb-0">Enter your email and we'll send a reset link.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_email">Email Address</label>
        {{ form.email }}
        {% if form.email.errors %}
        <div class="text-danger small mt-1">{{ form.email.errors }}</div>
        {% endif %}
      </div>
      <button type="submit" class="btn-gold">Send Reset Link</button>
    </form>
    <div class="text-center mt-3">
      <small><a href="{% url 'login' %}" class="text-muted">Back to login</a></small>
    </div>
  </div>
</body>
</html>
