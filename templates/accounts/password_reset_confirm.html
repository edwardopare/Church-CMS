{% extends 'base.html' %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><h5>Set a new password</h5></div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form.new_password1.label_tag }}
            {{ form.new_password1 }}
            {{ form.new_password2.label_tag }}
            {{ form.new_password2 }}
            <button type="submit" class="btn btn-gold mt-3">Change password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
