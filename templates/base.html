<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Church of Christ - RedTop CMS{% endblock %}</title>
  {% load static %}
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --sidebar-w: 260px;
      --navy: #0f172a;
      --navy-mid: #1e293b;
      --navy-light: #334155;
      --gold: #d4a843;
      --gold-light: #f0c96b;
      --cream: #faf8f2;
      --text-muted-custom: #94a3b8;
      --danger-soft: #fee2e2;
    }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; }

    #sidebar {
      position: fixed; top: 0; left: 0; height: 100vh;
    {% if user.is_authenticated %}
      <aside id="sidebar">
        <div class="brand">
          <h1>&#10013; Church of Christ - RedTop</h1>
          <small>Management System</small>
        </div>
        <nav>
          <div class="nav-section">Main</div>
          <a href="{% url 'dashboard' %}" class="nav-link {% block nav_dashboard %}{% endblock %}">
            <i class="fas fa-home"></i> Dashboard
          </a>
          <div class="nav-section">People</div>
          <a href="{% url 'member_list' %}" class="nav-link {% block nav_members %}{% endblock %}">
            <i class="fas fa-users"></i> Members
          </a>
          <a href="{% url 'visitor_list' %}" class="nav-link {% block nav_visitors %}{% endblock %}">
            <i class="fas fa-user-clock"></i> Visitors
          </a>
          <a href="{% url 'attendance_list' %}" class="nav-link {% block nav_attendance %}{% endblock %}">
            <i class="fas fa-clipboard-check"></i> Attendance
          </a>
          <div class="nav-section">Events</div>
          <a href="{% url 'event_list' %}" class="nav-link {% block nav_events %}{% endblock %}">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
          <a href="{% url 'event_calendar' %}" class="nav-link {% block nav_calendar %}{% endblock %}">
            <i class="fas fa-calendar"></i> Calendar
          </a>
          {% if user.is_finance %}
          <div class="nav-section">Finance</div>
          <a href="{% url 'finance_dashboard' %}" class="nav-link {% block nav_finance %}{% endblock %}">
            <i class="fas fa-chart-line"></i> Finance Dashboard
          </a>
          <a href="{% url 'transaction_list' %}" class="nav-link {% block nav_transactions %}{% endblock %}">
            <i class="fas fa-money-bill-wave"></i> Transactions
          </a>
          <a href="{% url 'financial_report' %}" class="nav-link {% block nav_fin_report %}{% endblock %}">
            <i class="fas fa-file-invoice-dollar"></i> Financial Report
          </a>
          {% endif %}
          <div class="nav-section">Communicate</div>
          <a href="{% url 'announcement_list' %}" class="nav-link {% block nav_announcements %}{% endblock %}">
            <i class="fas fa-bullhorn"></i> Announcements
          </a>
          <a href="{% url 'inbox' %}" class="nav-link {% block nav_inbox %}{% endblock %}">
            <i class="fas fa-envelope"></i> Inbox
          </a>
          {% if user.is_church_admin or user.is_pastor %}
          <div class="nav-section">Reports</div>
          <a href="{% url 'reports_dashboard' %}" class="nav-link {% block nav_reports %}{% endblock %}">
            <i class="fas fa-chart-bar"></i> Reports
          </a>
          {% endif %}
          {% if user.is_church_admin %}
          <div class="nav-section">Admin</div>
          <a href="{% url 'user_list' %}" class="nav-link {% block nav_users %}{% endblock %}">
            <i class="fas fa-user-cog"></i> Users
          </a>
          <a href="/admin/" class="nav-link">
            <i class="fas fa-tools"></i> Django Admin
          </a>
          {% endif %}
        </nav>
        <div class="user-footer">
          {% if user.profile_photo %}
            <img src="{{ user.profile_photo.url }}" width="32" height="32" style="border-radius:50%;object-fit:cover;" class="me-2"/>
          {% else %}
            <span style="width:32px;height:32px;border-radius:50%;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8rem;margin-right:8px;">
              {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
            </span>
          {% endif %}
          <div class="d-inline-block">
            <div class="user-name">{{ user.get_full_name|default:user.username }}</div>
            <div class="user-role">{{ user.get_role_display }}</div>
          </div>
          <div class="mt-2">
            <a href="{% url 'profile' %}"><i class="fas fa-user-edit me-1"></i>Profile</a>
            <span class="mx-1">·</span>
            <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
          </div>
        </div>
      </aside>
      <div id="main-content">
        <div id="topbar">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
              <i class="fas fa-bars"></i>
            </button>
            <div class="page-title">{% block page_title %}Dashboard{% endblock %}</div>
          </div>
          <div class="topbar-actions">
            <a href="{% url 'event_calendar' %}" class="text-muted" title="Calendar"><i class="fas fa-calendar"></i></a>
            <a href="{% url 'inbox' %}" class="text-muted" title="Messages"><i class="fas fa-envelope"></i></a>
            <a href="{% url 'announcement_list' %}" class="text-muted" title="Announcements"><i class="fas fa-bell"></i></a>
            <a href="{% url 'profile' %}" class="text-muted" title="Profile"><i class="fas fa-user-circle"></i></a>
          </div>
        </div>
        <div class="page-body">
          {% if messages %}
          <div class="messages-container">
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
          </div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </div>
    {% else %}
      <div class="container mt-5 simple-body">
        {% if messages %}
        <div class="messages-container">
          {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    {% endif %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script>
      document.getElementById('sidebarToggle')?.addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
      setTimeout(() => {
        document.querySelectorAll('.alert').forEach(el => {
          bootstrap.Alert.getOrCreateInstance(el)?.close();
        });
      }, 4000);
    </script>
    {% block extra_js %}{% endblock %}
    </body>
    </html>
      <span class="mx-1">·</span>
      <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
    </div>
  </div>
</aside>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
        <i class="fas fa-bars"></i>
      </button>
      <div class="page-title">{% block page_title %}Dashboard{% endblock %}</div>
    </div>
    <div class="topbar-actions">
      <a href="{% url 'event_calendar' %}" class="text-muted" title="Calendar"><i class="fas fa-calendar"></i></a>
      <a href="{% url 'inbox' %}" class="text-muted" title="Messages"><i class="fas fa-envelope"></i></a>
      <a href="{% url 'announcement_list' %}" class="text-muted" title="Announcements"><i class="fas fa-bell"></i></a>
      <a href="{% url 'profile' %}" class="text-muted" title="Profile"><i class="fas fa-user-circle"></i></a>
    </div>
  </div>

  <div class="page-body">
    {% if messages %}
    <div class="messages-container">
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  {% comment %} Shared page-body wrapper: authenticated users get full layout, anonymous users get a centered container {% endcomment %}
  {% if user.is_authenticated %}
    <div class="page-body">
  {% else %}
    <div class="page-body container mt-5 simple-body">
  {% endif %}

    {% if messages %}
    <div class="messages-container">
      {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

  </div>

{% if user.is_authenticated %}
  </div>
{% endif %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  document.getElementById('sidebarToggle')?.addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
      bootstrap.Alert.getOrCreateInstance(el)?.close();
    });
  }, 4000);
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
