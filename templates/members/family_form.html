{% extends 'base.html' %}
{% block title %}Add Family{% endblock %}
{% block page_title %}Add Family{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><h5>Create Family Group</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3"><label>{{ field.label }}</label>{{ field }}</div>
          {% endfor %}
          <button type="submit" class="btn btn-gold">Save</button>
          <a href="{% url 'family_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
